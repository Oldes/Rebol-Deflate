name: 'Rebol-Deflate CI'
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.21.0

    - name: Build 64bit Rebol/Deflate extension
      run: ./siskin Rebol-Deflate.nest -o ./deflate-windows-x64.rebx --msvc deflate-windows-x64

    - name: Minimal Rebol/Deflate extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v4
      with:
        name: Rebol-Deflate-Windows-CI-${{github.run_id}}
        path: ./*.rebx

  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.21.0

    - name: Build 64bit Rebol/Deflate extension
      run: ./siskin Rebol-Deflate.nest -o ./deflate-linux-x64.rebx --gzip deflate-linux-x64

    - name: Minimal Rebol/Deflate extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v4
      with:
        name: Rebol-Deflate-Linux-CI-${{github.run_id}}
        path: ./*.gz

  macos:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.21.0

    - name: Build AMD64 Rebol/Deflate extension
      run: ./siskin Rebol-Deflate.nest -o ./deflate-macos-x64.rebx --gzip deflate-macos-x64

    - name: Build ARM64 Rebol/Deflate extension
      run: ./siskin Rebol-Deflate.nest -o ./deflate-macos-arm64.rebx --gzip deflate-macos-arm64

    - name: Minimal Rebol/Deflate extension test
      run:  ./siskin --script ci-test.r3

    - uses: actions/upload-artifact@v4
      with:
        name: Rebol-Deflate-macOS-CI-${{github.run_id}}
        path: ./*.gz

